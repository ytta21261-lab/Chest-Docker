name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: mkdir -p www assets && cp index.html www/ && cp node_modules/three/build/three.min.js www/ && cp icon-only.png assets/
      - run: npx cap add android
      - run: python3 patch_manifest.py
      - name: Ikon aplikasi
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#2e7d4f' --iconBackgroundColorDark '#2e7d4f'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: minigolf-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
